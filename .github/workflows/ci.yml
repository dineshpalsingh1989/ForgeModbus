name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run protocol tests
        run: |
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure

  esp32-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fqbn: esp32:esp32:esp32
            ethernet: true
          - fqbn: esp32:esp32:esp32s2
          - fqbn: esp32:esp32:esp32s3
          - fqbn: esp32:esp32:esp32c3
          - fqbn: esp32:esp32:esp32c5
          - fqbn: esp32:esp32:esp32c6
          - fqbn: esp32:esp32:esp32p4
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.12
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples/HoldingRegisters
            - examples/FullDevice
            - examples/BackgroundTask
            ${{ matrix.ethernet && '- examples/Ethernet' || '' }}
          cli-compile-flags: |
            - --warnings
            - all
          enable-warnings-report: true
